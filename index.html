<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121110">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tt04-droid.github.io/">
<meta property="og:title" content="Thierry “TT” Edouard — UGC creator & creative director">
<meta property="og:description" content="Real life, shot like a campaign. UGC, short-form and brand films for lifestyle, fashion, fitness and sports brands. EN / FR.">
<meta property="og:image" content="https://tt04-droid.github.io/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23FF5A1F'/%3E%3Ctext x='32' y='42' font-family='Arial Black,Arial' font-weight='900' font-size='26' text-anchor='middle' fill='%23121110'%3ETT%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Thierry “TT” Edouard</title>
<meta name="description" content="UGC creator and creative director in San Francisco. Real life, shot like a campaign.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout concept: a campaign poster for one creator. Name as the headline, the work as a film strip, then a player, an index, a rate sheet and a brief. */
:root{
  --bone:#F1EEE7;     /* programme paper */
  --paper:#E6E0D3;    /* raised paper */
  --ink:#121110;      /* print black, broadcast black */
  --ink-2:#1E1C19;
  --orange:#FF5A1F;   /* TT orange */
  --muted:#6C675F;
  --muted-d:#A49F96;
  --line:rgba(18,17,16,.16);
  --line-d:rgba(241,238,231,.16);
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Instrument Serif","Times New Roman",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bone);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit}
img,video{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.wrap{max-width:1300px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.mono{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.cond{font-weight:850;font-stretch:70%;text-transform:uppercase;line-height:.86;letter-spacing:-.005em;margin:0;text-wrap:balance}
.voice{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:0;font-stretch:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 26px;border-radius:999px;text-decoration:none;font-weight:750;font-size:15px;border:2px solid var(--ink);background:var(--ink);color:var(--bone);cursor:pointer;transition:transform .2s,background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--orange);border-color:var(--orange);color:var(--ink);transform:translateY(-2px)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--bone)}

/* TICKER */
.ticker{background:var(--ink);color:var(--bone);overflow:hidden;height:34px;display:flex;align-items:center}
.ticker .track{display:flex;width:max-content;animation:tick 40s linear infinite}
.ticker span{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;padding:0 22px;border-right:1px solid var(--line-d)}
.ticker .live{color:var(--orange)}
@keyframes tick{to{transform:translateX(-50%)}}

/* NAV */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bone) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;height:66px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--orange);color:var(--ink);font-weight:900;font-stretch:72%;font-size:17px}
.logo span{font-weight:750;font-size:15px}
.nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0}
.nav ul a{text-decoration:none;font-weight:600;font-size:14.5px;color:var(--muted)}
.nav ul a:hover{color:var(--ink)}
.nav-r{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;height:38px}
.lang button{border:0;background:transparent;padding:0 12px;font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bone)}
.nav .btn{height:40px;padding:0 16px;font-size:14px}
@media (max-width:900px){.nav ul{display:none}.logo span{display:none}}
@media (max-width:400px){.nav .btn{display:none}}

/* HERO */
.hero{padding-block:clamp(28px,4.5vw,64px) clamp(28px,4vw,48px);overflow-x:clip}
.ctas{display:flex;flex-wrap:wrap;gap:12px}

/* poster hero */
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(14px,2vw,22px)}
.status{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border:1.5px solid var(--ink);border-radius:999px;font-size:13px;font-weight:700}
.status i{width:9px;height:9px;border-radius:50%;background:#1DB954;box-shadow:0 0 0 4px rgba(29,185,84,.2)}
.wordmark{font-weight:900;font-stretch:66%;text-transform:uppercase;line-height:.78;letter-spacing:-.015em;margin:0;font-size:clamp(80px,21.6vw,326px);display:grid}
.wordmark span{display:block;white-space:nowrap}
.wordmark .o{color:var(--orange);display:inline}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,1.4vw,18px);margin-top:calc(clamp(80px,21.6vw,326px) * -.16);position:relative;z-index:2;padding-inline:clamp(0px,3vw,48px)}
.tile{all:unset;cursor:pointer;display:grid;gap:10px;min-width:0}
.tile .v{aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:var(--ink);box-shadow:0 24px 50px -24px rgba(18,17,16,.6);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.tile:nth-child(odd) .v{transform:rotate(-2deg)}
.tile:nth-child(even) .v{transform:rotate(2deg) translateY(18px)}
.tile:hover .v{transform:rotate(0) translateY(-8px)}
.tile:focus-visible .v{outline:3px solid var(--orange);outline-offset:4px}
.tile video{width:100%;height:100%;object-fit:cover}
.tile .cap{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding-inline:4px}
.tile:nth-child(even) .cap{margin-top:18px}
.tile .cap b{color:var(--orange);font-weight:700}
@media (max-width:900px){
  .strip{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:40%;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 28px;margin-top:calc(clamp(80px,21.6vw,326px) * -.12);scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .tile{scroll-snap-align:start}
}
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:end;margin-top:clamp(36px,5vw,64px)}
@media (max-width:900px){.intro{grid-template-columns:1fr}}
.intro h1{font-size:clamp(52px,6.2vw,96px)}
.intro h1 .voice{color:var(--orange);font-size:1.04em}
.intro .side{display:grid;gap:22px;min-width:0}
.hero .lede{font-size:clamp(18px,1.6vw,20px);max-width:46ch;color:#2B2824;margin:0}
.hero .lede b{font-weight:750}
.note{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.15;color:var(--muted)}
.stats-bar{border-top:2px solid var(--ink);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:clamp(20px,3vw,36px)}
.stats-bar div{padding:18px 16px 20px 0;display:grid;gap:4px}
.stats-bar div+div{padding-left:20px;border-left:1px solid var(--line)}
.stats-bar strong{font-weight:900;font-stretch:70%;font-size:clamp(38px,4.2vw,58px);line-height:.9;font-variant-numeric:tabular-nums}
.stats-bar span{font-size:14px;color:var(--muted);font-weight:500}
@media (max-width:760px){.stats-bar{grid-template-columns:repeat(2,minmax(0,1fr))}.stats-bar div:nth-child(3){border-left:0;padding-left:0}.stats-bar div:nth-child(n+3){border-top:1px solid var(--line)}}

/* SECTIONS */
section{scroll-margin-top:72px}
.sec{padding-block:clamp(80px,9vw,128px)}
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr);gap:24px;align-items:end;margin-bottom:clamp(32px,4vw,52px)}
@media (max-width:860px){.head{grid-template-columns:1fr}}
.head .tag{display:flex;gap:12px;align-items:center;margin-bottom:14px;color:var(--orange)}
.head .tag em{font-style:normal;color:inherit;opacity:.6}
.head h2{font-size:clamp(54px,7.6vw,108px)}
.head p{color:var(--muted);max-width:42ch;margin:0}
.dark{background:var(--ink);color:var(--bone)}
.dark .head p{color:var(--muted-d)}

/* BROADCAST REPLAYS */
.broadcast{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4vw,64px);align-items:start}
@media (max-width:900px){.broadcast{grid-template-columns:1fr}}
.screen{position:relative;width:min(100%,400px);aspect-ratio:9/16;border-radius:28px;overflow:hidden;background:#000;justify-self:center;box-shadow:0 0 0 10px var(--ink-2),0 40px 80px -30px rgba(0,0,0,.8)}
.screen video{width:100%;height:100%;object-fit:cover}
.l3{position:absolute;left:12px;right:12px;bottom:14px;display:grid;gap:8px;pointer-events:none}
.l3 .bar{display:flex;align-items:stretch;border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.l3 .bar span{padding:7px 10px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--orange);color:var(--ink)}
.l3 .bar span+span{background:rgba(18,17,16,.85);color:var(--bone)}
.l3 h3{margin:0;font-weight:900;font-stretch:70%;text-transform:uppercase;font-size:clamp(28px,3vw,38px);line-height:.9;color:var(--bone);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.live-dot{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;background:rgba(18,17,16,.75);color:var(--bone);padding:6px 10px;border-radius:999px}
.live-dot i{width:8px;height:8px;border-radius:50%;background:#FF2D2D;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.snd{position:absolute;top:12px;right:12px;border:0;cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--bone);color:var(--ink);font-weight:750;font-size:13px;padding:9px 14px;border-radius:999px}
.replays{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-d)}
.rp{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:40px 56px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 10px;border-bottom:1px solid var(--line-d);border-radius:0;transition:background .2s}
.rp:hover{background:var(--ink-2)}
.rp:focus-visible{outline:3px solid var(--orange);outline-offset:-3px}
.rp .no{font-family:var(--mono);font-size:12px;color:var(--muted-d)}
.rp .th{width:56px;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:var(--ink-2)}
.rp .th img{width:100%;height:100%;object-fit:cover}
.rp h4{margin:0;font-weight:850;font-stretch:75%;text-transform:uppercase;font-size:clamp(20px,2vw,26px);line-height:1}
.rp .k{font-size:14px;color:var(--muted-d)}
.rp .d{font-family:var(--mono);font-size:12px;color:var(--muted-d)}
.rp[aria-current="true"]{background:var(--orange);color:var(--ink)}
.rp[aria-current="true"] .no,.rp[aria-current="true"] .k,.rp[aria-current="true"] .d{color:var(--ink)}
.small{font-size:14px;color:var(--muted-d);margin-top:16px}

/* FIXTURES */
.fx-head,.fx{display:grid;grid-template-columns:52px minmax(0,1.6fr) minmax(0,.9fr) minmax(0,1fr) 72px 60px;gap:18px;align-items:center}
.fx-head{padding:0 0 10px;border-bottom:2px solid var(--ink);color:var(--muted)}
.fixtures{list-style:none;margin:0;padding:0}
.fx{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:52px minmax(0,1.6fr) minmax(0,.9fr) minmax(0,1fr) 72px 60px;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);transition:padding .3s,background .3s}
.fx:hover{background:var(--paper);padding-left:12px;padding-right:12px}
.fx:focus-visible{outline:3px solid var(--orange);outline-offset:-3px}
.fx .no{font-family:var(--mono);font-size:12px;color:var(--muted)}
.fx h3{margin:0;font-weight:900;font-stretch:70%;text-transform:uppercase;font-size:clamp(28px,3.4vw,48px);line-height:.92}
.fx .fclub{display:grid;gap:2px;font-size:15px}
.fx .fclub b{font-weight:750}
.fx .fclub span,.fx .role{color:var(--muted);font-size:15px}
.fx .ft{font-family:var(--mono);font-size:12px;font-weight:700;background:var(--ink);color:var(--bone);padding:5px 8px;border-radius:6px;justify-self:start}
.fx .th{width:60px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:var(--paper)}
.fx .th img{width:100%;height:100%;object-fit:cover}
@media (max-width:860px){.fx-head{display:none}.fixtures{border-top:2px solid var(--ink)}.fx{grid-template-columns:minmax(0,1fr) 56px;gap:4px 16px}.fx .no,.fx .role,.fx .ft{display:none}.fx h3{grid-column:1}.fx .fclub{grid-column:1}.fx .th{grid-column:2;grid-row:1/3;width:56px}}
.peek{position:fixed;z-index:40;width:220px;aspect-ratio:9/16;border-radius:18px;overflow:hidden;pointer-events:none;box-shadow:0 30px 60px -20px rgba(18,17,16,.55);opacity:0;transform:scale(.9) rotate(4deg);transition:opacity .2s,transform .25s;background:var(--ink)}
.peek.on{opacity:1;transform:scale(1) rotate(4deg)}
.peek video{width:100%;height:100%;object-fit:cover}
@media (hover:none){.peek{display:none}}

/* FEES */
.fees{border-top:2px solid var(--ink)}
.fee{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) 140px 170px;gap:24px;align-items:center;padding:26px 0;border-bottom:1px solid var(--line);transition:background .25s,padding .25s}
.fee:hover{background:var(--paper);padding-left:14px;padding-right:14px}
.fee:focus-visible{outline:3px solid var(--orange);outline-offset:-3px}
.fee h3{margin:0;font-weight:900;font-stretch:70%;text-transform:uppercase;font-size:clamp(30px,3.2vw,44px);line-height:.9}
.fee p{margin:0;color:var(--muted);font-size:16px}
.fee .t{font-family:var(--mono);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.fee .p{font-weight:900;font-stretch:70%;font-size:clamp(40px,4vw,56px);line-height:.85;text-align:right;font-variant-numeric:tabular-nums}
.fee .p small{font-size:16px;font-weight:600;font-stretch:100%;opacity:.7}
.fee .p.q{font-size:clamp(26px,2.4vw,32px)}
.fee.star{background:var(--ink);color:var(--bone);padding-left:20px;padding-right:20px;border-radius:18px;border:0;margin-block:8px}
.fee.star p{color:var(--muted-d)}
.fee.star:hover{background:var(--ink-2)}
.fee .badge{display:inline-block;margin-left:10px;vertical-align:middle;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--orange);color:var(--ink);padding:4px 8px;border-radius:6px}
@media (max-width:860px){.fee{grid-template-columns:minmax(0,1fr) auto;gap:8px 16px}.fee p{grid-column:1/-1;grid-row:2}.fee .t{grid-column:1;grid-row:3}.fee .p{grid-column:2;grid-row:1/2}}

/* PROFILE */
.profile{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(32px,6vw,90px);align-items:center}
@media (max-width:900px){.profile{grid-template-columns:1fr}}
.profile figure{margin:0;position:relative}
.profile figure img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:60% 50%;border-radius:22px}
.profile figcaption{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--bone);color:var(--ink)}
.chip.o{background:var(--orange)}
.profile .copy{display:grid;gap:22px;min-width:0}
.profile h2{font-size:clamp(52px,6.8vw,96px)}
.profile h2 .voice{display:block;color:var(--orange);font-size:.62em;margin-top:.12em}
.profile p{font-size:19px;max-width:52ch;margin:0}
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:2px solid var(--ink)}
.sheet div{display:grid;gap:2px;padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}
.sheet dt{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet dd{margin:0;font-weight:700;font-size:16px}
@media (max-width:460px){.sheet{grid-template-columns:1fr}}

/* OFFER */
.offer{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:clamp(32px,5vw,80px);align-items:start}
@media (max-width:960px){.offer{grid-template-columns:1fr}}
.offer h2{font-size:clamp(56px,7.6vw,112px)}
.offer h2 .voice{color:var(--orange)}
.direct{display:grid;gap:20px;margin-top:26px}
.email{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.email code{font-family:var(--sans);font-weight:750;font-size:clamp(18px,2vw,23px);user-select:all;word-break:break-all}
.ghost{border:1px solid var(--line-d);background:transparent;color:var(--bone);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:650;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.ghost:hover{border-color:var(--orange);color:var(--orange)}
.socials{display:flex;flex-wrap:wrap;gap:10px}
form{background:var(--bone);color:var(--ink);border-radius:26px;padding:clamp(22px,3vw,36px);display:grid;gap:16px;position:relative}
form::before{content:attr(data-sheet);position:absolute;top:-12px;left:28px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;background:var(--orange);color:var(--ink);padding:5px 10px;border-radius:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
label,.legend{display:grid;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
label .opt{font-family:var(--sans);font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);font-size:13px}
input,select,textarea{font:inherit;font-family:var(--sans);font-size:16px;text-transform:none;letter-spacing:0;font-weight:500;width:100%;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:13px 14px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:120px;resize:vertical}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;width:1px;height:1px}

  {id:'kitz-brand-story',len:'1:14',club:'KITZ',en:['KITZ Brand Story','Founder film','Concept, on camera, edit','The brand in its founder’s words, with the community that built it.'],fr:['L’histoire de KITZ','Film fondateur','Concept, à l’écran, montage','La marque racontée par son fondateur, avec la communauté qui l’a construite.']},
  {id:'how-its-made',len:'0:48',club:'KITZ',en:['How It’s Made','Product film','Direction, edit','Eleven steps from idea to the street: design, ink, thread, box, handoff.'],fr:['Comment c’est fait','Film produit','Direction, montage','Onze étapes de l’idée à la rue : design, encre, fil, boîte, remise.']},
  {id:'after-dark',len:'0:22',club:'TT',en:['After Dark','Fashion · Bay Area','Styling, direction, edit','One fit per location, shot at night across SF, Berkeley and Oakland.'],fr:['After Dark','Mode · Bay Area','Stylisme, direction, montage','Une tenue par lieu, filmée de nuit à SF, Berkeley et Oakland.']},
  {id:'squad-announcement',len:'0:31',club:'KITZ FC',en:['KITZ FC Squad','Campaign · Motion','Concept, design, motion','Players revealed like a transfer window: ratings, cards, a starting XI.'],fr:['L’effectif KITZ FC','Campagne · Motion','Concept, design, motion','Des joueurs dévoilés comme un mercato : notes, cartes, onze de départ.']},
  {id:'together-we-move',len:'0:33',club:'KITZ',en:['Together We Move','Brand film','Direction, edit','The crew, the pitch and the city in thirty seconds.'],fr:['Together We Move','Film de marque','Direction, montage','L’équipe, le terrain et la ville en trente secondes.']},
  {id:'wherever-we-go',len:'1:10',club:'TT',en:['Wherever We Go','Culture · Haiti → SF','Direction, edit','Food, Flag Day, carnival and the World Cup. A diaspora story in seventy seconds.'],fr:['Wherever We Go','Culture · Haïti → SF','Direction, montage','La cuisine, la fête du drapeau, le carnaval et la Coupe du monde. Une histoire de diaspora en soixante-dix secondes.']},
  {id:'sunday-league',len:'0:44',club:'TT',en:['Sunday League','Sport · Broadcast style','Edit, graphics','Lose in the semis, come back for the trophy. Cut with live-TV graphics.'],fr:['Sunday League','Sport · Style télé','Montage, graphismes','Perdre en demie, revenir pour le trophée. Monté avec des graphismes de direct télé.']}

const FEES = [
  {svc:'ugc',en:['UGC video','Product demo, routine or review. Hook variations on request.'],fr:['Vidéo UGC','Démo produit, routine ou avis. Variantes d’accroche sur demande.'],t:'per',p:null},
  {svc:'dropkit',star:true,en:['Drop Kit','10 images + 3 videos (teaser, launch, recap), captions and a posting plan.'],fr:['Drop Kit','10 images + 3 vidéos (teaser, lancement, récap), légendes et plan de publication.'],t:'days7',p:'$450'},
  {svc:'engine',en:['Content Engine','15 images + 6 videos a month, a monthly plan and weekly delivery.'],fr:['Content Engine','15 images + 6 vidéos par mois, un plan mensuel et une livraison chaque semaine.'],t:'monthly',p:'$900',mo:true},
  {svc:'lookbook',en:['Lookbook Lift','10 edited images from your shoot or your existing photos.'],fr:['Lookbook Lift','10 images retouchées, à partir de votre shooting ou de vos photos existantes.'],t:'days5',p:'$250'},
  {svc:'direction',en:['Creative direction','Campaigns, brand films, shoots on location and events.'],fr:['Direction créative','Campagnes, films de marque, tournages en extérieur et événements.'],t:'byproj',p:null}
];

let lang = 'en', current = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const L = () => T[lang];

function renderStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { const v = L()[el.dataset.i]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('[data-ih]').forEach(el => { el.innerHTML = L()[el.dataset.ih]; });
  const ph = {'#f-name':'ph_name','#f-email':'ph_email','#f-brand':'ph_brand','#f-date':'ph_date','#f-msg':'ph_msg'};
  for (const k in ph) $(k).placeholder = L()[ph[k]];
  const tk = L().ticker.map((x,i) => `<span class="${i===0?'live':''}">${x}</span>`).join('');
  $('#ticker').innerHTML = tk + tk;
  $('#sheet').innerHTML = L().sheet.map(([k,v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  $('#form').dataset.sheet = lang === 'fr' ? 'BRIEF PROJET' : 'PROJECT BRIEF';
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'));
}
const STRIP=[['after-dark','work'],['ugc-kitz-gym','ugc'],['wherever-we-go','work'],['ugc-wyze','ugc'],['sunday-league','work']];
function renderLists(){
  $('#strip').innerHTML = STRIP.map(([id,kind]) => { const it = (kind==='ugc'?UGC:WORK).find(x=>x.id===id); const cat = (kind==='ugc'? it[lang][1] : it[lang][1]).split(' · ')[0]; return `<button type="button" class="tile" data-${kind==='ugc'?'ugcopen':'open'}="${id}" aria-label="${it[lang][0]}"><span class="v"><video src="media/loop-${id}.mp4" poster="img/${id}.jpg" muted loop playsinline autoplay preload="auto"></video></span><span class="cap"><b>${kind==='ugc'?'UGC':(lang==='fr'?'Direction':'Direction')}</b><span>${cat}</span></span></button>`; }).join('');
  if (reduce) document.querySelectorAll('#strip video').forEach(v => { v.removeAttribute('autoplay'); v.pause(); });
  $('#replays').innerHTML = UGC.map((u,i) => { const [t,k] = u[lang]; return `<li><button type="button" class="rp" data-rp="${i}" aria-current="${i===current}"><span class="no">${String(i+1).padStart(2,'0')}</span><span class="th"><img src="img/${u.id}.jpg" alt="" loading="lazy"></span><span><h4>${t}</h4><span class="k">${k}</span></span><span class="d">${u.len}</span></button></li>`; }).join('');
  $('#fixtures-list').innerHTML = WORK.map((w,i) => { const [t,cat,role] = w[lang]; return `<li><button type="button" class="fx" data-open="${w.id}"><span class="no">${String(i+1).padStart(2,'0')}</span><h3>${t}</h3><span class="fclub"><b>${w.club}</b><span>${cat}</span></span><span class="role">${role}</span><span class="ft">${w.len}</span><span class="th"><img src="img/${w.id}.jpg" alt="" loading="lazy"></span></button></li>`; }).join('');
  $('#fees-list').innerHTML = FEES.map(f => { const [n,d] = f[lang]; const price = f.p ? `${f.p}${f.mo ? `<small>${L().mo}</small>` : ''}` : L().quote; return `<button type="button" class="fee${f.star?' star':''}" data-svc="${f.svc}"><h3>${n}${f.star?`<span class="badge">${L().best}</span>`:''}</h3><p>${d}</p><span class="t">${L()[f.t]}</span><span class="p${f.p?'':' q'}">${price}</span></button>`; }).join('');
  setReplay(current, false);
  bindPeek();
}
function setLang(l, push){
  lang = l === 'fr' ? 'fr' : 'en';
  try { localStorage.setItem('tt-lang', lang); } catch(e) {}
  if (push) { try { history.replaceState(null, '', lang === 'fr' ? '#fr' : location.pathname + location.search); } catch(e) {} }
  renderStatic(); renderLists();
}

// broadcast player
const bv = $('#bc-v'); let soundOn = false;
function setReplay(i, play = true){
  current = i; const u = UGC[i]; const [t,k] = u[lang];
  $('#bc-no').textContent = String(i+1).padStart(2,'0'); $('#bc-k').textContent = k; $('#bc-t').textContent = t;
  document.querySelectorAll('.rp').forEach((b,j) => b.setAttribute('aria-current', j === i ? 'true' : 'false'));
  if (!play) return;
  const src = soundOn ? `media/${u.id}.mp4` : `media/loop-${u.id}.mp4`;
  bv.poster = `img/${u.id}.jpg`; bv.src = src; bv.muted = !soundOn; bv.loop = !soundOn; bv.controls = soundOn;
  bv.play().catch(()=>{});
}
document.addEventListener('click', e => {
  const r = e.target.closest('[data-rp]'); if (r) { setReplay(+r.dataset.rp); return; }
  const f = e.target.closest('[data-svc]'); if (f) { const map={ugc:'s1',dropkit:'s2',engine:'s3',direction:'s4',lookbook:'s5'}; $('#'+map[f.dataset.svc]).checked = true; $('#offer').scrollIntoView({behavior: reduce ? 'auto' : 'smooth'}); setTimeout(()=>$('#f-name').focus({preventScroll:true}), 600); return; }
  const u = e.target.closest('[data-ugcopen]'); if (u) { const i = UGC.findIndex(x => x.id === u.dataset.ugcopen); soundOn = true; $('#bc-snd').textContent = L().sound_off; setReplay(i); $('#highlights').scrollIntoView({behavior: reduce ? 'auto' : 'smooth'}); return; }
  const o = e.target.closest('[data-open]'); if (o) { e.preventDefault(); openLB(o.dataset.open); }
});
$('#bc-snd').addEventListener('click', () => { soundOn = !soundOn; $('#bc-snd').textContent = soundOn ? L().sound_off : L().sound; setReplay(current); });
bv.addEventListener('ended', () => { if (soundOn) setReplay((current + 1) % UGC.length); });
if (reduce) { bv.removeAttribute('autoplay'); bv.pause(); }

// fixtures peek
const peek = $('#peek'), pv = peek.querySelector('video');
function bindPeek(){
  if (!matchMedia('(hover:hover)').matches || reduce) return;
  document.querySelectorAll('.fx').forEach(r => {
    r.addEventListener('mouseenter', () => { pv.src = 'media/' + r.dataset.open + '.mp4'; pv.currentTime = 2; pv.play().catch(()=>{}); peek.classList.add('on'); });
    r.addEventListener('mouseleave', () => { peek.classList.remove('on'); pv.pause(); });
    r.addEventListener('mousemove', e => { peek.style.left = Math.min(innerWidth - 240, e.clientX + 28) + 'px'; peek.style.top = Math.min(innerHeight - 410, Math.max(80, e.clientY - 190)) + 'px'; });
  });
}

// lightbox
const lb = $('#lb'), lv = $('#lb-v');
function openLB(id){
  const w = WORK.find(x => x.id === id); if (!w) return; const [t,cat,role,d] = w[lang];
  peek.classList.remove('on'); pv.pause(); bv.pause();
  lv.src = 'media/' + id + '.mp4'; lv.poster = 'img/' + id + '.jpg';
  $('#lb-k').textContent = w.club + ' · ' + cat; $('#lb-t').textContent = t; $('#lb-d').textContent = d; $('#lb-r').textContent = role;
  lb.showModal ? lb.showModal() : lb.setAttribute('open','');
  lv.play().catch(()=>{});
}
function closeLB(){ lv.pause(); lv.removeAttribute('src'); lv.load(); lb.close ? lb.close() : lb.removeAttribute('open'); if (!reduce) bv.play().catch(()=>{}); }
$('#lb-x').addEventListener('click', closeLB);
lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('lb-in')) closeLB(); });
lb.addEventListener('cancel', e => { e.preventDefault(); closeLB(); });

// language
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang, true)));
let start = 'en';
try { start = localStorage.getItem('tt-lang') || (navigator.language || '').slice(0,2); } catch(e) { start = (navigator.language || '').slice(0,2); }
if (location.hash === '#fr') start = 'fr'; else if (location.hash === '#en') start = 'en';
addEventListener('hashchange', () => { if (location.hash === '#fr' || location.hash === '#en') setLang(location.hash.slice(1), false); });
setLang(start === 'fr' ? 'fr' : 'en', false);

// copy
async function copyText(text, btn, label){ try { await navigator.clipboard.writeText(text); btn.textContent = lang==='fr'?'Copié':'Copied'; } catch { btn.textContent = lang==='fr'?'Sélectionnez':'Select it'; } setTimeout(() => btn.textContent = label(), 2000); }
$('#copy').addEventListener('click', e => copyText(EMAIL, e.currentTarget, () => L().copy));
$('#fb-copy').addEventListener('click', e => copyText($('#fb-text').value, e.currentTarget, () => L().fb_copy));

// form
const form = $('#form'), err = $('#err'), send = $('#send');
form.addEventListener('submit', async e => {
  e.preventDefault(); err.hidden = true;
  const fd = new FormData(form); if (fd.get('_honey')) return;
  const d = Object.fromEntries(fd.entries());
  const need = ['name','email','brand','message'].filter(k => !String(d[k]||'').trim());
  if (need.length) { err.textContent = L().e_missing; err.hidden = false; $('#f-' + (need[0]==='message'?'msg':need[0])).focus(); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) { err.textContent = L().e_email; err.hidden = false; $('#f-email').focus(); return; }
  send.disabled = true; send.textContent = L().sending;
  const service = T.en.svc[d.service] || d.service;
  const payload = { access_key:W3F_KEY, subject:`New brief: ${d.brand} — ${service}`, from_name:'TT Studio site', replyto:d.email,
    name:d.name, email:d.email, brand:d.brand, service, budget:d.budget, needed_by:d.needed_by || '—', language: lang === 'fr' ? 'French' : 'English', message:d.message };
  try {
    const c = new AbortController(); const tm = setTimeout(() => c.abort(), 12000);
    const r = await fetch(ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify(payload), signal:c.signal});
    clearTimeout(tm); const j = await r.json().catch(() => ({}));
    if (!r.ok || String(j.success) === 'false') throw new Error(j.message || 'failed');
    $('#form-body').hidden = true; $('#done').hidden = false;
  } catch(x) {
    const body = `Name: ${d.name}\nEmail: ${d.email}\nBrand: ${d.brand}\nService: ${service}\nBudget: ${d.budget}\nNeeded by: ${d.needed_by||'—'}\n\n${d.message}`;
    $('#fb-text').value = body;
    $('#fb-mail').href = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(EMAIL) + '&su=' + encodeURIComponent(payload.subject) + '&body=' + encodeURIComponent(body);
    $('#form-body').hidden = true; $('#fallback').hidden = false;
  } finally { send.disabled = false; send.textContent = L().send; }
});
</script>
